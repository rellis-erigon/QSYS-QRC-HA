rescan:
  name: Re-scan controls
  description: >-
    Ask the add-on to re-read controls from the Q-SYS Core. Use this after a
    change on the core rather than waiting for a reconnect.
  fields:
    core:
      name: Q-SYS Core
      description: Limit the scan to one core. Omit to scan all of them.
      required: false
      selector:
        text:

generate_zone_card:
  name: Generate zone card
  description: >-
    Build an audio-zone-card for the zones this Core exposes, with each
    strip bound to its own level and mute. Returns the card and its YAML.
  fields:
    groups:
      name: Zones
      description: >-
        Which devices to include, in the order you want the strips. Omit to
        include every exposed zone.
      required: false
      selector:
        object:
