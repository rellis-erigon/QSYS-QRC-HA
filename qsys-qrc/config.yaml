name: "Q-SYS QRC Bridge"
description: "Discover Q-SYS Core controls over QRC and expose them to Home Assistant"
version: "0.1.2"
slug: qsys-qrc
url: "https://github.com/rellis-erigon/QSYS-QRC-HA"
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:tune-vertical
panel_title: Q-SYS
arch:
  - aarch64
  - amd64
  - armv7
map:
  - config:rw
options:
  cores:
    - name: ""
      host: ""
      port: 1710
      username: ""
      password: ""
  poll_rate: 0.5
  log_level: "info"
schema:
  cores:
    - name: str
      host: str
      port: port
      username: str?
      password: password?
  poll_rate: float(0.1,10)
  log_level: list(debug|info|warning|error)
